name: conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -m unittest discover -s tools/tests -v

      - name: Conformance suite
        run: python tools/run_conformance.py --verbose

      - name: Documentation links
        run: python tools/check_links.py

      - name: Examples are canonical
        shell: bash
        run: |
          set -e
          for file in examples/*.iac; do
            python tools/iac_lint.py fmt "$file" --check
          done
